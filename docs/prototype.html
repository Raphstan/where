<title>WHERE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a dark studio stage holding one device frame (phone or laptop); the product inside is cream, warm, conversational. */
:root{
  --stage:#0F141D; --stage-2:#181F2B; --stage-fg:#E9E3D6; --stage-muted:#8B94A5;
  --cream:#F7F2E9; --cream-2:#FBF8F2; --sand:#EADFCC; --sand-2:#F1E9DB; --line:#E3D9C7;
  --ink:#16202E; --ink-2:#2B3443; --muted:#75705F; --soft:#A39E8F;
  --sea:#2E6E8E; --sea-2:#DCE9EF; --coral:#DF6F55; --coral-2:#FBE4DC;
  --olive:#5E7F5A; --olive-2:#E3ECDD; --amber:#C7913A; --amber-2:#F7EBD2;
  --night:#1A2436; --night-2:#243247;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r-lg:26px;
  --shadow:0 1px 2px rgba(22,32,46,.04),0 10px 30px -12px rgba(22,32,46,.18);
  --shadow-lg:0 30px 80px -30px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#0B0F16;--stage-2:#141A24;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#0B0F16;--stage-2:#141A24;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--stage-fg);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Stage / prototype chrome ---------- */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:14px 28px}
.protobar{width:100%;max-width:1280px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--stage-fg)}
.protobar .brand{font-family:var(--display);font-size:20px;letter-spacing:.08em;font-weight:500;display:flex;align-items:center;gap:10px}
.protobar .brand small{font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stage-muted);font-weight:600}
.protobar .spacer{flex:1}
.seg{display:inline-flex;background:var(--stage-2);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--stage-muted);transition:.2s}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.pbtn{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);font-weight:600;font-size:13px;color:var(--stage-fg);background:var(--stage-2);display:inline-flex;align-items:center;gap:8px}
.pbtn:hover{border-color:rgba(255,255,255,.3)}
.pbtn.accent{background:var(--coral);border-color:var(--coral);color:#fff}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--stage-2);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:8px;width:300px;max-height:min(70vh,560px);overflow:auto;z-index:50;box-shadow:var(--shadow-lg)}
.menu button{display:flex;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;font-size:13px;color:var(--stage-fg)}
.menu button:hover{background:rgba(255,255,255,.06)}
.menu button i{font-style:normal;color:var(--stage-muted);font-variant-numeric:tabular-nums;width:22px;flex:none}
.menu .mh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stage-muted);padding:10px 10px 4px;font-weight:700}
.hint{font-size:12px;color:var(--stage-muted);text-align:center;max-width:720px}
.hint b{color:var(--stage-fg);font-weight:600}

/* ---------- Device frames ---------- */
.device{position:relative;background:var(--cream);color:var(--ink);overflow:hidden;box-shadow:var(--shadow-lg);transition:width .35s cubic-bezier(.2,.7,.2,1),height .35s cubic-bezier(.2,.7,.2,1),border-radius .35s}
.device.mobile{width:min(393px,100%);height:min(840px,calc(100vh - 110px));min-height:640px;border-radius:46px;border:10px solid #0b0d12;box-shadow:0 0 0 2px #2a2f3a,var(--shadow-lg)}
.device.mobile::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#0b0d12;border-radius:999px;z-index:30}
.device.desktop{width:min(1280px,100%);height:min(820px,calc(100vh - 110px));min-height:600px;border-radius:14px;border:1px solid rgba(255,255,255,.1)}
.device.desktop .browser{height:40px;background:#E9E2D4;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}
.device.desktop .browser .dots{display:flex;gap:6px}.device.desktop .browser .dots i{width:11px;height:11px;border-radius:50%;background:#CFC6B4;display:block}
.device.desktop .browser .url{flex:1;max-width:420px;margin:0 auto;background:var(--cream);border-radius:8px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.device.mobile .browser{display:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.device.desktop #app{top:40px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pad{padding:22px 22px 28px}
.device.mobile .pad{padding-top:56px}
.pad .topbar{padding:0 0 12px}
.device.mobile .pad .topbar{padding-top:0}

/* ---------- Typography ---------- */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-display{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.08;letter-spacing:-.01em}
.h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.12;letter-spacing:-.01em}
.h2{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.2}
.h3{font-weight:700;font-size:15px}
.lead{font-size:15px;color:var(--muted);line-height:1.5}
.small{font-size:12.5px;color:var(--muted)}
.tiny{font-size:11.5px;color:var(--soft)}
.ink{color:var(--ink)}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt{margin-top:18px}.mt-s{margin-top:10px}.mt-l{margin-top:28px}
.sp{flex:1}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;font-weight:700;font-size:14.5px;transition:transform .12s,background .2s,box-shadow .2s;min-height:46px;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--cream)}
.btn.primary:hover{background:#0f1722}
.btn.coral{background:var(--coral);color:#fff}
.btn.coral:hover{background:#d2644b}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.soft{background:var(--sand-2);color:var(--ink)}
.btn.soft:hover{background:var(--sand)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;min-height:36px;font-size:13px}
.btn.xs{padding:6px 11px;min-height:30px;font-size:12.5px;font-weight:600}
.btn.wa{background:#25D366;color:#fff}
.link{color:var(--sea);font-weight:600;text-decoration:none;background:none;font-size:13.5px}
.link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--cream-2);border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);transition:.15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chip.sea{background:var(--sea-2);border-color:transparent;color:var(--sea)}
.chip.x{padding-right:8px}
.chip .rm{opacity:.6;font-size:15px;line-height:1}

/* ---------- Cards ---------- */
.card{background:var(--cream-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.night{background:var(--night);color:var(--cream);border-color:transparent}
.card.night .small,.card.night .tiny{color:#B9C0CC}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0}
.item .t{font-weight:600}
.item .s{font-size:12.5px;color:var(--muted)}

/* avatars */
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none;letter-spacing:.02em;font-family:var(--display);box-shadow:inset 0 -6px 12px rgba(0,0,0,.12)}
.av.sm{width:26px;height:26px;font-size:11px}.av.lg{width:52px;height:52px;font-size:19px}.av.xl{width:68px;height:68px;font-size:24px}
.av.sarah{background:linear-gradient(145deg,#E58A6F,#B9553F)}
.av.noam{background:linear-gradient(145deg,#3E7F9F,#1F4F68)}
.av.maya{background:linear-gradient(145deg,#C8A35A,#8C6A2A)}
.av.david{background:linear-gradient(145deg,#6D8F67,#3E5E3A)}
.av.me{background:linear-gradient(145deg,#2B3443,#16202E)}
.av.where{background:var(--coral);font-family:var(--body)}
.avs{display:inline-flex}.avs .av{margin-left:-8px;border:2px solid var(--cream-2)}.avs .av:first-child{margin-left:0}

/* photos: painted light scenes */
.photo{position:relative;border-radius:14px;overflow:hidden;background:#333;aspect-ratio:16/10;max-width:100%}
.photo::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 110%,rgba(0,0,0,.35),transparent 60%)}
.photo.kandinof{background:radial-gradient(60% 50% at 30% 30%,#F2B37A 0%,transparent 60%),radial-gradient(40% 40% at 75% 65%,#D1623F 0%,transparent 60%),linear-gradient(160deg,#5C2B2E 0%,#1C1A2B 60%,#0E1420 100%)}
.photo.herzl{background:radial-gradient(50% 50% at 70% 25%,#F6D28C 0%,transparent 55%),radial-gradient(60% 40% at 20% 80%,#2E6E8E 0%,transparent 60%),linear-gradient(200deg,#3B2A3B,#111A2A)}
.photo.cqc{background:radial-gradient(40% 50% at 25% 35%,#8FB8C8 0%,transparent 60%),radial-gradient(50% 45% at 75% 75%,#E8A58A 0%,transparent 60%),linear-gradient(180deg,#F1E6D3,#B9A590)}
.photo.tishbi{background:radial-gradient(60% 55% at 30% 20%,#FBE2B0 0%,transparent 60%),radial-gradient(60% 50% at 80% 80%,#7E9E63 0%,transparent 60%),linear-gradient(190deg,#D9C9A4,#5F7B4C)}
.photo.cafe{background:radial-gradient(50% 50% at 70% 30%,#F3E4C7 0%,transparent 60%),linear-gradient(180deg,#C9B394,#6E5A45)}
.photo.rome{background:radial-gradient(50% 50% at 30% 30%,#F7C9A5 0%,transparent 60%),radial-gradient(40% 40% at 80% 70%,#B9654A 0%,transparent 60%),linear-gradient(190deg,#D9A27E,#5B3A33)}
.photo.beach{background:radial-gradient(60% 50% at 50% 20%,#FFF2CF 0%,transparent 60%),linear-gradient(180deg,#8CC3D6 0%,#3E8FB0 55%,#E7D7B5 56%,#D8C39A 100%)}
.photo.bar{background:radial-gradient(40% 50% at 25% 35%,#E7A35B 0%,transparent 60%),radial-gradient(40% 40% at 80% 60%,#9B3F4A 0%,transparent 60%),linear-gradient(190deg,#2A1E2E,#0F131F)}
.photo.ny{background:radial-gradient(40% 50% at 70% 30%,#F0C27F 0%,transparent 60%),linear-gradient(190deg,#30364B,#0F1420)}
.photo .glow{position:absolute;inset:0;background:repeating-radial-gradient(circle at 60% 40%,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);mix-blend-mode:overlay}
.photo .lbl{position:absolute;left:12px;bottom:10px;color:#fff;font-family:var(--display);font-size:17px;z-index:1;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.photo.sq{aspect-ratio:1}

/* ---------- Evidence levels ---------- */
.ev{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.ev i{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;box-shadow:0 0 0 3px var(--cream-2)}
.ev.reco i{background:var(--coral)}
.ev.visited i{background:var(--olive)}
.ev.booked i{background:var(--sea)}
.ev.saved i{background:var(--amber)}
.ev.public i{background:transparent;border:1.5px solid var(--soft)}
.ev.pref i{background:var(--ink)}
.conf{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:999px}
.conf .bars{display:inline-flex;gap:2px}.conf .bars i{width:5px;height:11px;border-radius:2px;background:currentColor;opacity:.25;transition:opacity .4s}
.conf.forte{background:var(--olive-2);color:var(--olive)}.conf.forte .bars i{opacity:1}
.conf.moyenne{background:var(--amber-2);color:#8E6A22}.conf.moyenne .bars i:nth-child(-n+2){opacity:1}
.conf.explo{background:var(--sea-2);color:var(--sea)}.conf.explo .bars i:nth-child(1){opacity:1}
.conf.faible{background:var(--sand-2);color:var(--muted)}.conf.faible .bars i:nth-child(1){opacity:.6}

/* ---------- Mobile app chrome ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;flex:none}
.device.mobile .topbar{padding-top:52px}
.topbar .wordmark{font-family:var(--display);letter-spacing:.14em;font-weight:500;font-size:15px}
.topbar .wordmark::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--coral);margin-left:5px;vertical-align:middle}
.backbtn{width:34px;height:34px;border-radius:50%;background:var(--sand-2);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.tabs{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--cream);padding:8px 10px 22px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--soft);padding:4px 10px;border-radius:12px;min-width:64px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink)}
.device.desktop .tabs{display:none}

/* ---------- Desktop shell ---------- */
.shell{flex:1;min-height:0;display:flex}
.side{width:248px;flex:none;border-right:1px solid var(--line);background:var(--cream);display:flex;flex-direction:column;padding:18px 14px}
.side .wordmark{font-family:var(--display);letter-spacing:.14em;font-weight:500;font-size:16px;padding:4px 8px 16px}
.side .wordmark::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--coral);margin-left:5px;vertical-align:middle}
.side .nb{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;font-weight:600;font-size:13.5px;color:var(--ink-2);width:100%;text-align:left}
.side .nb:hover{background:var(--sand-2)}
.side .nb[aria-current="page"]{background:var(--ink);color:var(--cream)}
.side .nb svg{width:18px;height:18px;flex:none}
.side .hist{margin-top:14px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.side .hist button{text-align:left;padding:8px 10px;border-radius:10px;font-size:12.5px;color:var(--muted);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .hist button:hover{background:var(--sand-2);color:var(--ink)}
.side .hist button.on{color:var(--ink);background:var(--sand-2)}
.side .foot{display:flex;align-items:center;gap:10px;padding:10px 8px 0;border-top:1px solid var(--line);margin-top:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.device.mobile .side{display:none}
.rpanel{width:380px;flex:none;border-left:1px solid var(--line);background:var(--cream-2);display:flex;flex-direction:column;animation:slideL .3s ease}
@keyframes slideL{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.rpanel .ph{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.rpanel .pb{flex:1;overflow:auto;padding:18px}
.device.mobile .rpanel{display:none}
.desk-wrap{max-width:720px;width:100%;margin:0 auto}
.device.desktop .screen.onb .scroll{display:flex;justify-content:center}
.device.desktop .screen.onb .pad{max-width:680px;width:100%;padding:56px 32px}
.device.desktop .screen.onb.wide .pad{max-width:900px}

/* ---------- Sheets (mobile) ---------- */
.sheet-bg{position:absolute;inset:0;background:rgba(22,32,46,.45);backdrop-filter:blur(2px);z-index:40;animation:fade .25s;display:flex;align-items:flex-end}
.device.desktop .sheet-bg{align-items:center;justify-content:center}
.sheet{background:var(--cream);width:100%;max-height:88%;border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .35s cubic-bezier(.2,.7,.2,1)}
.device.desktop .sheet{max-width:520px;border-radius:24px;max-height:85%;box-shadow:var(--shadow-lg)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0}
.device.desktop .sheet .grab{display:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 20px 8px}
.sheet .sb{overflow:auto;padding:8px 20px 28px}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--sand-2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;margin-left:auto}

/* ---------- Chat ---------- */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.msgs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px}
.device.desktop .msgs{padding:24px 36px}
.device.desktop .msgs>*{max-width:760px;width:100%;margin-inline:auto}
.m{display:flex;gap:10px;align-items:flex-end}
.m.enter{animation:pop .4s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.m.user{justify-content:flex-end}
.bub{max-width:86%;padding:12px 15px;border-radius:20px;font-size:14.5px;line-height:1.45}
.m.user .bub{background:var(--ink);color:var(--cream);border-bottom-right-radius:6px}
.m.where .bub{background:var(--cream-2);border:1px solid var(--line);border-bottom-left-radius:6px;color:var(--ink)}
.m.where .bub b{font-weight:700}
.m .av.where{width:26px;height:26px;font-size:10px;margin-bottom:2px}
.device.desktop .m .av.where{display:none}
.wide{width:100%;display:flex;flex-direction:column;gap:10px}
.m.wide-m{align-items:stretch}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--soft);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.crit{display:flex;flex-wrap:wrap;gap:6px}
.crit .chip{font-size:12.5px;padding:6px 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts .chip{padding:9px 14px;font-size:13.5px}
.opts .chip:disabled{opacity:.5;cursor:default}
.composer{flex:none;padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--cream)}
.device.desktop .composer{border-top:0;padding:10px 36px 26px}
.device.desktop .composer .cbox{max-width:760px;margin:0 auto}
.cbox{display:flex;align-items:center;gap:8px;background:var(--cream-2);border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px}
.cbox:focus-within{border-color:var(--ink)}
.cbox input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14.5px;color:var(--ink);outline:none}
.cbox input::placeholder{color:var(--soft)}
.sendb{width:38px;height:38px;border-radius:50%;background:var(--coral);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sendb svg{width:18px;height:18px}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}

async function runScenario(k,fromHistory,text){

  try{
    S.chat=[];S.seen=new Set();S.panel=null;S.sheet=null;S.scenario=k;S.booked=null;S.screen='chat';S.tab='chat';

function preset(kind){

    if(kind==='book'){S.sheet={type:'sheet',kind:'book',id:'kandinof'}}

    if(kind==='zikhron')add({t:'people',ids:[['david','Connaît bien la région'],['sarah','A enregistré deux lieux à proximité'],['maya','Y est allée récemment']]});
    else{add({t:'asked',html:'Envoyé à <b>Sarah, David et Maya</b> sur WhatsApp. Je te préviens dès qu’ils répondent — rien d’autre n’a été envoyé.',to:['sarah','david','maya']});S.sarah.sent=false;S.askStep='compose'}

function jump(sec){
  S.menuOpen=false;
  switch(sec){
    case 'home':case 'how':case 'onb':case 'sources-connect':case 'gmail':case 'gmail-results':case 'circle-setup':case 'memory':case 'sources':case 'privacy':case 'edge':go(sec);break;
    case 'qualify':S.qIdx=0;S.qStep=0;S.qAns={};go('qualify');break;
    case 'chat-first':newChat();runScenario('date');break;
    case 'chat-results':preset('date');go('chat');break;
    case 'chat-why':preset('date');S.screen='chat';openPanel({type:'why',id:'kandinof'});break;
    case 'chat-insufficient':preset('zikhron');go('chat');break;
    case 'ask':preset('zikhron');S.askMsg='Raphaël cherche un bon endroit pour déjeuner samedi à Zikhron Ya’akov avec deux enfants, pas trop touristique. Tu as une recommandation ?';S.askTo={david:true,sarah:true,maya:true};go('ask',{askStep:'compose'});break;
    case 'sarah':preset('live');S.sarah.sent=false;go('sarah');break;

    case 'circle-mem':preset('live');S.sarah.sent=true;S.sarah.priv2=true;{const add=m=>{m.id=++S.msgId;S.chat.push(m);S.seen.add(m.id)};add({t:'notice',cls:'coral',ic:'✦',html:'<b>Sarah vient de répondre.</b> J’ai une nouvelle recommandation plus fiable — sa réponse change le classement.'});add({t:'live',place:'tishbi',strong:true});add({t:'circlemem'})}go('chat');break;

    case 'chat-book':preset('book');render();break;

  }
}

      <button class="btn ghost block" onclick="${del('Supprimer la source Gmail ? Les futures confirmations ne seront plus lues.','Supprimer la source','Source Gmail supprimée')}">Supprimer une source</button>
      <button class="btn ghost block" onclick="${del('Supprimer les 23 lieux importés ? Tes recommandations manuelles et les réponses de ton cercle sont conservées.','Supprimer les lieux','23 lieux importés supprimés')}">Supprimer tous les lieux importés</button>
      <button class="btn ghost block danger" style="border-color:var(--coral-2)" onclick="${del('Supprimer ton compte et toutes tes données ? Cette action est définitive.','Supprimer mon compte','Demande de suppression enregistrée')}">Supprimer mon compte</button>
    </div>
  </div>`;
  return `<div class="screen"><div class="scroll"><div class="pad">${S.device==='mobile'?topbar('WHERE',"go('profile')"):''}<div class="desk-wrap">${inner}</div></div></div></div>`;
}
function scrProfile(){
  const inner=`<div class="stack" style="gap:14px">
    <div class="row" style="gap:14px">${av({id:'me',ini:'R'},'xl')}<div><div class="h1">Raphaël</div><div class="small">Tel Aviv · aime les endroits élégants, cachés, vivants mais pas trop bruyants</div></div></div>
    <div class="card flat"><div class="eyebrow" style="margin-bottom:8px">Mes préférences apprises</div><div class="row wrap" style="gap:6px">${['caché','pas trop bruyant','élégant','vivant','terrasse','vin nature','petits hôtels'].map(x=>`<span class="chip" style="font-size:12px;font-weight:500">${x}</span>`).join('')}</div></div>
    <div class="list">${[['Mes sources',ICON.src,"go('sources')"],['Confidentialité',ICON.lock,"go('privacy')"],['États limites & cas particuliers',ICON.edge,"go('edge')"],['Revoir l’onboarding',ICON.chat,"go('onb')"]].map(([l,i,a])=>`<button class="item" style="width:100%;text-align:left" onclick="${a}"><span style="width:22px;color:var(--muted)">${i}</span><span class="t grow">${l}</span><span style="color:var(--soft)">›</span></button>`).join('')}</div>
  </div>`;
  return `<div class="screen"><div class="scroll"><div class="pad">${S.device==='mobile'?topbar('WHERE'):''}<div class="desk-wrap">${inner}</div></div></div></div>`;
}
function scrEdge(){
  const E=[
    ['Aucun résultat personnel','« Personne dans ton cercle ne connaît encore suffisamment ce quartier. »','Élargir les critères · 3 découvertes publiques · demander à deux personnes · essayer un quartier proche',"runScenario('beach')",'Voir en situation'],
    ['Informations contradictoires','« Sarah trouve ce lieu calme, mais Noam indique qu’il devient bruyant après 22 h. »','WHERE explique la nuance (calme avant 22 h) au lieu de trancher arbitrairement.',"runScenario('bar')",'Voir en situation'],
    ['Lieu fermé','« Ce lieu apparaît dans d’anciennes recommandations, mais semble désormais fermé. »','Écarté des résultats, gardé dans la mémoire avec une mention.',"runScenario('cafe')",'Voir en situation'],
    ['Ancienne recommandation','« Cette recommandation date de trois ans. Veux-tu demander une information plus récente ? »','Un bouton prépare la question à la bonne personne.',"runScenario('cafe')",'Voir en situation'],
    ['Pas de disponibilité','« HaBasta est complet ce soir. »','Un lieu proche de qualité similaire, ou une autre heure.',"runScenario('group')",'Voir en situation'],
    ['Réservation annulée','Une réservation annulée ne compte jamais comme visite.','Email d’annulation Tabit détecté → le lieu reste « réservé, annulé », sans signal de visite.',"toast('Exemple : MILA · réservation annulée · non comptée')",'Exemple'],
    ['Livraison','Une commande Tabit, Wolt ou une livraison n’est pas une visite au restaurant.','12 commandes exclues lors de l’import Gmail.',"openSheet({type:'sheet',kind:'deliveries'})",'Voir les exclusions'],
    ['Refus d’accès Gmail','Le produit reste utilisable.','Recommandations manuelles, liens partagés, réponses des proches, données publiques.',"go('onb')",'Reprendre sans Gmail'],
  ];
  const inner=`<div class="stack" style="gap:14px">
    <h2 class="h1">États limites</h2>
    <p class="lead">Ce que WHERE fait quand il ne sait pas, ou quand les signaux se contredisent.</p>
    ${E.map(([t,q,d,a,b])=>`<div class="card flat stack" style="gap:8px"><div class="h3">${t}</div><div class="notice soft" style="padding:9px 12px"><span class="ic">“</span><span>${q}</span></div><p class="small">${d}</p><button class="btn ghost xs" style="align-self:flex-start" onclick="${a}">${b}</button></div>`).join('')}
  </div>`;
  return `<div class="screen"><div class="scroll"><div class="pad">${S.device==='mobile'?topbar('WHERE',"go('profile')"):''}<div class="desk-wrap">${inner}</div></div></div></div>`;
}
